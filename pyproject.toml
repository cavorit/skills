[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dc-pair"
version = "0.1.0"
description = "Generate the prompt that pairs a coding agent with a running DataCards project"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]

[project.urls]
Repository = "https://github.com/cavorit/skills"

[project.scripts]
dc-pair = "dc_pair.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/dc_pair"]
